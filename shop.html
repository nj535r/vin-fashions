<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.github.com; form-action 'self' https://*.payu.in https://*.payu.com https://*.payumoney.com; base-uri 'none'; object-src 'none'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shop – VIN Fashions</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hdr"></div>
<main id="main" class="wrap">
  <div class="crumbs"><a href="index.html">Home</a> / <span id="crumb">Shop</span></div>
  <div class="shop">
    <aside class="filters" id="filters" aria-label="Filters">
      <fieldset><legend>Category</legend><div id="fCat"></div></fieldset>
      <fieldset><legend>Price</legend>
        <div id="fPrice"></div>
      </fieldset>
      <fieldset><legend>Size</legend><div class="chips" id="fSize"></div></fieldset>
      <fieldset><legend>Colour</legend><div class="chips" id="fColor"></div></fieldset>
      <fieldset><label><input type="checkbox" id="fStock"> In stock only</label></fieldset>
      <button class="btn ghost sm" id="reset" type="button">Clear all filters</button>
    </aside>
    <section aria-labelledby="ttl">
      <div class="tools">
        <div><h1 id="ttl" style="font-size:1.5rem;margin:0">All clothing</h1><span class="muted" id="count"></span></div>
        <div style="display:flex;gap:8px"><button class="btn ghost sm" id="fbtn" type="button" aria-expanded="false" aria-controls="filters">Filters</button>
        <label class="sr" for="sort">Sort</label>
        <select id="sort"><option value="new">Newest</option><option value="plh">Price: low to high</option><option value="phl">Price: high to low</option><option value="disc">Biggest discount</option></select></div>
      </div>
      <div class="grid" id="grid" aria-live="polite"><p class="muted">Loading…</p></div>
    </section>
  </div>
</main>
<div id="ftr"></div>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script src="js/pages/shop.js"></script>
</body>
</html>
