<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.github.com; form-action 'self' https://*.payu.in https://*.payu.com https://*.payumoney.com; base-uri 'none'; object-src 'none'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Your bag – VIN Fashions</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hdr"></div>
<main id="main" class="wrap">
  <h1 style="padding-top:26px;margin:0">Your bag</h1>
  <div id="empty" class="empty" hidden><p>Your bag is empty.</p><a class="btn" href="shop.html">Continue shopping</a></div>
  <div class="cartg" id="cartg">
    <section aria-label="Items" id="lines"></section>
    <aside>
      <div class="box sum" id="sum"></div>
      <form class="box" id="form" style="margin-top:16px" novalidate autocomplete="on">
        <h2 style="font-size:1.15rem">Delivery details</h2>
        <div class="fld"><label for="name">Full name</label><input id="name" name="name" autocomplete="name" required maxlength="80"></div>
        <div class="two">
          <div class="fld"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required maxlength="100"></div>
          <div class="fld"><label for="phone">Mobile (10 digits)</label><input id="phone" name="phone" inputmode="numeric" autocomplete="tel-national" required maxlength="10"></div>
        </div>
        <div class="fld"><label for="addr">Address</label><textarea id="addr" name="address" rows="2" autocomplete="street-address" required maxlength="250"></textarea></div>
        <div class="two">
          <div class="fld"><label for="city">City</label><input id="city" name="city" autocomplete="address-level2" required maxlength="60"></div>
          <div class="fld"><label for="state">State</label><input id="state" name="state" autocomplete="address-level1" required maxlength="60"></div>
        </div>
        <div class="fld" style="max-width:200px"><label for="pin">PIN code</label><input id="pin" name="pincode" inputmode="numeric" autocomplete="postal-code" required maxlength="6"></div>
        <div class="hp" aria-hidden="true"><label>Leave empty <input id="website" name="website" tabindex="-1" autocomplete="off"></label></div>
        <div id="err" role="alert"></div>
        <button class="btn accent" id="pay" style="width:100%" type="submit">Pay securely with PayU</button>
        <p class="muted" style="font-size:.85rem;margin:10px 0 0">You will be redirected to PayU to pay by UPI, card, net banking or wallet. By paying you accept our <a href="policies.html#terms">terms</a> and <a href="policies.html#returns">returns policy</a>.</p>
      </form>
    </aside>
  </div>
</main>
<div id="ftr"></div>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script src="js/pages/cart.js"></script>
</body>
</html>
