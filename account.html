<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com https://api.github.com; form-action 'self' https://*.payu.in https://*.payu.com https://*.payumoney.com; base-uri 'none'; object-src 'none'; manifest-src 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My account – VIN Fashions</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="hdr"></div>
<main id="main" class="wrap">
  <div id="guest" style="max-width:440px;margin:36px auto" hidden>
    <div class="tabs" role="tablist"><button role="tab" id="tl" aria-selected="true">Log in</button><button role="tab" id="ts" aria-selected="false">Create account</button></div>
    <form id="fl" class="box" novalidate>
      <div class="fld"><label for="le">Email</label><input id="le" type="email" autocomplete="email" required></div>
      <div class="fld"><label for="lp">Password</label><input id="lp" type="password" autocomplete="current-password" required></div>
      <div class="err" role="alert"></div><button class="btn accent" style="width:100%">Log in</button>
    </form>
    <form id="fs" class="box" novalidate hidden>
      <div class="fld"><label for="sn">Full name</label><input id="sn" autocomplete="name" required maxlength="80"></div>
      <div class="fld"><label for="se">Email</label><input id="se" type="email" autocomplete="email" required maxlength="100"></div>
      <div class="fld"><label for="sph">Mobile (10 digits)</label><input id="sph" inputmode="numeric" autocomplete="tel-national" required maxlength="10"></div>
      <div class="fld"><label for="sp">Password (8+ characters)</label><input id="sp" type="password" autocomplete="new-password" required minlength="8" maxlength="100"></div>
      <div class="err" role="alert"></div><button class="btn accent" style="width:100%">Create account</button>
    </form>
    <p class="muted" style="font-size:.88rem">You can also check out as a guest. We store only what is needed to deliver your orders. Forgot your password? Email <span id="sup"></span>.</p>
  </div>

  <div id="mine" hidden style="padding:28px 0 56px">
    <div class="sec-h"><h1 id="hi" style="font-size:1.6rem;margin:0"></h1><button class="btn ghost sm" id="logout">Log out</button></div>
    <div class="cartg">
      <section><h2>My orders</h2><div id="orders" aria-live="polite"><p class="muted">Loading…</p></div></section>
      <aside><form class="box" id="fa" novalidate><h2 style="font-size:1.1rem">Saved delivery address</h2>
        <div class="fld"><label for="aa">Address</label><textarea id="aa" rows="2" maxlength="250" required></textarea></div>
        <div class="two"><div class="fld"><label for="ac">City</label><input id="ac" maxlength="60" required></div><div class="fld"><label for="as">State</label><input id="as" maxlength="60" required></div></div>
        <div class="fld" style="max-width:200px"><label for="ap">PIN code</label><input id="ap" inputmode="numeric" maxlength="6" required></div>
        <div class="err" role="alert"></div><button class="btn">Save address</button></form></aside>
    </div>
  </div>
</main>
<div id="ftr"></div>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script src="js/pages/account.js"></script>
</body>
</html>
